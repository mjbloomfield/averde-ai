<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The AI Business Assessment | Averde AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600&family=Source+Serif+4:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --honey-50:#F6E8D0; --honey-100:#E8C896; --honey-300:#C99356; --honey-500:#9C6A33; --honey-700:#6B4520;
    --walnut-300:#7A5238; --walnut-500:#4F3522; --walnut-700:#2A1B11;
    --bone:#E5DBC9; --driftwood:#B7A990; --smoke:#7B6E5B;
    --paper:#F4ECDB; --ink:#1F1A12; --ink-700:#48392A; --muted:#7A6A58;
    --aged-cream:#EDE3D0;
    --rust:#A86237;
    --pass:#3a6f4d; --warn:#9C6A33; --fail:#A04324;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Source Serif 4',Georgia,serif; font-size:16px; line-height:1.55; }
  h1,h2,h3,h4 { font-family:'Fraunces',Georgia,serif; letter-spacing:-0.02em; line-height:1.15; font-weight:500; margin:0; }
  p { margin:0; }
  .shell { min-height:100vh; padding:40px 16px 64px; }
  .shell-inner { max-width:680px; margin:0 auto; }
  .shell-inner.wide { max-width:880px; }
  .wordmark { text-align:center; margin-bottom:32px; font-family:'Fraunces',serif; font-size:24px; color:var(--walnut-700); font-weight:500; letter-spacing:-0.02em; }
  .wordmark span { color:var(--honey-500); }
  .card { background:#fff; border:1px solid var(--bone); border-radius:24px; padding:32px; }
  @media (min-width:640px){ .card { padding:48px; } }
  .fade-in { animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }

  .eyebrow { font-family:'Inter Tight',sans-serif; font-size:11px; font-weight:600; color:var(--honey-500); text-transform:uppercase; letter-spacing:0.14em; margin-bottom:12px; }
  .label { font-family:'Inter Tight',sans-serif; font-size:13px; font-weight:600; color:var(--ink-700); text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:8px; }
  .hint { font-size:14px; color:var(--smoke); margin-top:8px; }
  .dek { color:var(--muted); font-size:18px; margin:12px 0 32px; }

  .brand-btn { background:var(--walnut-700); color:var(--paper); border:0; border-radius:12px; padding:14px 28px; font-family:'Inter Tight',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.01em; cursor:pointer; transition:background 0.18s; }
  .brand-btn:hover { background:var(--walnut-500); }
  .brand-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .ghost-btn { background:none; border:0; color:var(--ink-700); font-family:'Inter Tight',sans-serif; font-weight:500; font-size:14px; cursor:pointer; padding:8px 0; }
  .ghost-btn:hover { color:var(--walnut-700); }
  .step-footer { display:flex; align-items:center; justify-content:space-between; padding-top:24px; margin-top:32px; border-top:1px solid var(--bone); }

  .input { background:#fff; border:1.5px solid var(--driftwood); border-radius:10px; padding:13px 16px; width:100%; font-family:'Source Serif 4',serif; font-size:16px; color:var(--ink); transition:border 0.15s; }
  .input:focus { outline:none; border-color:var(--honey-300); }
  .input::placeholder { color:var(--driftwood); opacity:1; }
  select.input:has(option[value=""]:checked) { color:var(--driftwood); }
  .input.input-error { border-color:var(--fail); }
  .step-err { font-family:'Inter Tight',sans-serif; font-size:14px; font-weight:500; color:var(--fail); margin:16px 0 0; }
  textarea.input { resize:vertical; }
  select.input { appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%237B6E5B' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:right 16px center; padding-right:40px; }
  .field-grid { display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width:640px){ .field-grid { grid-template-columns:1fr 1fr; } }

  .progress-wrap { margin-bottom:32px; }
  .progress-labels { display:flex; justify-content:space-between; margin-bottom:8px; }
  .progress-labels span { font-family:'Inter Tight',sans-serif; font-size:13px; font-weight:600; color:var(--ink-700); text-transform:uppercase; letter-spacing:0.08em; }
  .progress { background:var(--bone); height:4px; border-radius:99px; overflow:hidden; }
  .progress-bar { background:var(--honey-300); height:100%; transition:width 0.4s ease; }

  .check-row { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:1.5px solid var(--bone); border-radius:12px; cursor:pointer; transition:all 0.15s; background:#fff; }
  .check-row:hover { border-color:var(--honey-300); }
  .check-row.selected { border-color:var(--walnut-700); background:var(--aged-cream); }
  .check-box { flex-shrink:0; width:20px; height:20px; border:1.5px solid var(--driftwood); border-radius:5px; margin-top:2px; display:flex; align-items:center; justify-content:center; }
  .check-row.selected .check-box { background:var(--walnut-700); border-color:var(--walnut-700); }
  .pains-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:640px){ .pains-grid { grid-template-columns:1fr 1fr; } }

  /* Report styles */
  .report-head { text-align:center; margin-bottom:40px; }
  .report-head h1 { font-size:clamp(2rem,5vw,3rem); margin:8px 0; }
  .report-sub { color:var(--muted); font-size:18px; }

  .score-panel { background:#fff; border:1px solid var(--bone); border-radius:24px; padding:32px; display:flex; flex-direction:column; gap:24px; align-items:center; margin-bottom:24px; }
  @media (min-width:640px){ .score-panel { flex-direction:row; padding:40px; } }
  .score-ring-wrap { position:relative; width:140px; height:140px; flex-shrink:0; }
  .score-ring-wrap svg circle.arc { stroke-linecap:round; transform:rotate(-90deg); transform-origin:center; transition:stroke-dashoffset 0.8s ease; }
  .score-ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring-num { font-family:'Fraunces',serif; font-size:36px; font-weight:500; }
  .score-ring-grade { font-family:'Inter Tight',sans-serif; font-size:12px; font-weight:600; }
  .score-copy h2 { font-size:26px; margin-bottom:10px; }
  .score-copy p { color:var(--muted); }
  .score-basis { font-family:'Inter Tight',sans-serif; font-size:12px; color:var(--smoke); margin-top:10px; }

  .section-block { background:#fff; border:1px solid var(--bone); border-radius:20px; padding:28px; margin-bottom:24px; }
  @media (min-width:640px){ .section-block { padding:32px; } }
  .section-block h3 { font-size:22px; margin-bottom:6px; }
  .section-block > .section-dek { color:var(--muted); font-size:15px; margin-bottom:20px; }

  .checks-table { display:flex; flex-direction:column; }
  .check-item { border-top:1px solid var(--bone); }
  .check-item:first-child { border-top:0; }
  .check-item summary { list-style:none; display:flex; align-items:center; gap:12px; padding:13px 4px; cursor:pointer; }
  .check-item summary::-webkit-details-marker { display:none; }
  .check-status { flex-shrink:0; width:22px; height:22px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; font-family:'Inter Tight',sans-serif; font-weight:700; }
  .check-status.pass { background:var(--pass); } .check-status.warn { background:var(--warn); }
  .check-status.fail { background:var(--fail); } .check-status.na { background:var(--driftwood); }
  .check-name { flex:1; font-size:15px; color:var(--ink); }
  .check-pts { font-family:'Inter Tight',sans-serif; font-size:12px; font-weight:600; color:var(--smoke); white-space:nowrap; }
  .check-chevron { color:var(--driftwood); transition:transform 0.15s; font-size:12px; }
  .check-item[open] .check-chevron { transform:rotate(180deg); }
  .check-detail { padding:2px 4px 16px 34px; font-size:14px; color:var(--ink-700); }
  .check-detail .why { margin-bottom:8px; }
  .check-detail .fix { background:var(--aged-cream); border-radius:8px; padding:10px 14px; }
  .check-detail .fix strong { font-family:'Inter Tight',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--honey-500); display:block; margin-bottom:4px; }

  .vis-results { display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .vis-hit { border-radius:10px; padding:10px 14px; background:var(--aged-cream); }
  .vis-hit.you { background:rgba(58,111,77,.12); border:1px solid rgba(58,111,77,.4); }
  .vis-hit .t { font-family:'Inter Tight',sans-serif; font-size:14px; font-weight:600; color:var(--ink); }
  .vis-hit .h { font-size:12px; color:var(--smoke); margin-top:2px; }
  .vis-badge { display:inline-block; font-family:'Inter Tight',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; padding:5px 12px; border-radius:999px; margin-bottom:12px; }
  .vis-badge.good { background:rgba(58,111,77,.12); color:var(--pass); }
  .vis-badge.bad  { background:rgba(160,67,36,.12); color:var(--fail); }
  .vis-queries { display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .vis-q { border:1px solid var(--bone); border-radius:10px; background:var(--paper); }
  .vis-q summary { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; list-style:none; }
  .vis-q summary::-webkit-details-marker { display:none; }
  .vis-q-mark { font-weight:700; flex-shrink:0; }
  .vis-q-mark.good { color:var(--pass); }
  .vis-q-mark.bad { color:var(--fail); }
  .vis-q-text { font-family:'Inter Tight',sans-serif; font-size:14px; font-weight:600; color:var(--ink); flex:1; }
  .vis-q .vis-results { margin:0; padding:0 14px 12px; }
  .vis-q[open] .check-chevron { transform:rotate(180deg); }

  .plan-list { display:flex; flex-direction:column; gap:16px; }
  .plan-item { border:1px solid var(--bone); border-radius:16px; padding:22px; background:#fff; }
  .plan-num { font-family:'Fraunces',serif; font-size:26px; color:var(--driftwood); }
  .plan-item h4 { font-size:19px; margin:6px 0 8px; }
  .plan-item .why { font-size:14.5px; color:var(--ink-700); margin-bottom:14px; }
  .plan-diy { background:var(--aged-cream); border-radius:10px; padding:14px 16px; font-size:14px; color:var(--ink-700); }
  .plan-diy strong, .plan-short strong { font-family:'Inter Tight',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--honey-500); display:block; margin-bottom:6px; }
  .plan-diy ul { margin:0; padding-left:18px; } .plan-diy li { margin-bottom:4px; }
  .plan-short { margin-top:10px; font-size:14px; color:var(--ink-700); padding:0 16px; }

  .cta-panel { background:var(--walnut-700); color:var(--paper); border-radius:24px; padding:40px 28px; text-align:center; margin-top:32px; }
  .cta-panel h2 { color:var(--paper); font-size:clamp(1.6rem,3.5vw,2.2rem); margin-bottom:12px; }
  .cta-panel p { color:var(--bone); max-width:520px; margin:0 auto 24px; }
  .cta-btn { display:inline-block; background:var(--honey-300); color:var(--walnut-700); font-family:'Inter Tight',sans-serif; font-weight:600; font-size:15px; padding:15px 30px; border-radius:12px; text-decoration:none; }
  .cta-note { font-size:13px; color:var(--driftwood); margin-top:16px; }

  .pending { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; padding:14px 0; }
  .spinner { width:16px; height:16px; border:2px solid var(--bone); border-top-color:var(--honey-500); border-radius:999px; animation:spin 0.8s linear infinite; flex-shrink:0; }
  .live-strip { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted); background:var(--bone); border-radius:10px; padding:10px 14px; margin-bottom:22px; }
  .live-strip.done { color:var(--ink-700); }
  .live-strip .tick { color:#3a6f4d; font-weight:700; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .restart { text-align:center; margin-top:28px; }
  /* Reference view (?view=all) — the internal /ai-business-assessment-mark page. */
  .ref-head { margin:64px 0 20px; }
  .ref-head:first-of-type { margin-top:0; }
  .ref-head h2 { font-size:22px; color:var(--walnut-700); }
  .ref-head p { font-size:14px; color:var(--smoke); margin-top:6px; }
  .ref-rule { border:0; border-top:1px solid var(--driftwood); margin:56px 0 0; }
  .ref-table { width:100%; border-collapse:collapse; font-size:14px; background:#fff; border:1px solid var(--bone); border-radius:16px; overflow:hidden; }
  .ref-table th { text-align:left; font-family:'Inter Tight',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--smoke); padding:12px 14px; border-bottom:1px solid var(--bone); }
  .ref-table td { padding:12px 14px; border-bottom:1px solid var(--bone); vertical-align:top; }
  .ref-table tr:last-child td { border-bottom:0; }
  .ref-id { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--honey-500); white-space:nowrap; }
  .ref-label { font-family:'Inter Tight',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--honey-500); }
</style>
</head>
<body>
<div class="shell"><div class="shell-inner" id="shell">
  <div class="wordmark">Averde<span>.</span></div>
  <div id="root"></div>
</div></div>

<script>
(function () {
'use strict';

// Embedded on /ai-consulting the page carries the branding already.
if (window.self !== window.top) {
  document.querySelector('.wordmark').style.display = 'none';
}

/* ================================================================
   The AI Business Assessment — find your stage on the AI adoption path,
   get your next moves. No readiness gate: everyone is somewhere,
   and the report shows the next step from wherever that is. It
   feeds the free 30-minute call: the report IS the prep material.
================================================================ */

const TEAM_SIZES = ['Just me','2–5 people','6–15 people','16+ people'];
// Company mode: with a team, questions ask about the company, not the owner.
function co() { return !!state.teamSize && state.teamSize !== 'Just me'; }
const TEAM_SHARE_OPTS = [
  { v:'none',  label:'Nobody, really' },
  { v:'few',   label:'A person or two' },
  { v:'some',  label:'Some of the team' },
  { v:'most',  label:'Most of the team' },
];

// Question buckets per CLAUDE.md "segment before you ask": the classifier
// (/api/classify-business, NAICS-derived type list) picks the bucket, and
// every hours category + report move comes from that bucket's world.
// frac = share of that work AI can realistically absorb (conservative).
const BUCKET_CATS = {
  appointment: [
    { id:'intake',     label:'Intake forms & client paperwork',      frac:0.6 },
    { id:'scheduling', label:'Scheduling, rebooking & reminders',    frac:0.6 },
    { id:'questions',  label:'Answering the same client questions',  frac:0.7 },
    { id:'notes',      label:'Session notes & records',              frac:0.5 },
    { id:'dataentry',  label:'Moving info between systems',          frac:0.7 },
    { id:'content',    label:'Marketing & content creation',         frac:0.5 },
  ],
  project: [
    { id:'quoting',    label:'Quotes & proposals',                   frac:0.5 },
    { id:'scheduling', label:'Scheduling jobs & crews',              frac:0.6 },
    { id:'followup',   label:'Lead & customer follow-up',            frac:0.6 },
    { id:'questions',  label:'Answering the same questions',         frac:0.7 },
    { id:'dataentry',  label:'Moving data between systems',          frac:0.7 },
    { id:'content',    label:'Marketing & content creation',         frac:0.5 },
  ],
  retail: [
    { id:'productq',   label:'Answering product questions',          frac:0.7 },
    { id:'orders',     label:'Orders, returns & refunds',            frac:0.6 },
    { id:'inventory',  label:'Inventory, listings & menus',          frac:0.6 },
    { id:'followup',   label:'Customer follow-up & reviews',         frac:0.6 },
    { id:'dataentry',  label:'Moving data between systems',          frac:0.7 },
    { id:'content',    label:'Marketing & content creation',         frac:0.5 },
  ],
  professional: [
    { id:'intakepro',  label:'Client intake & onboarding',           frac:0.6 },
    { id:'drafting',   label:'Drafting documents & letters',         frac:0.6 },
    { id:'updates',    label:'Client updates & status emails',       frac:0.6 },
    { id:'questions',  label:'Answering the same questions',         frac:0.7 },
    { id:'dataentry',  label:'Moving data between systems',          frac:0.7 },
    { id:'content',    label:'Marketing & content creation',         frac:0.5 },
  ],
};
function cats() { return BUCKET_CATS[state.bucket] || BUCKET_CATS.project; }
const HOUR_OPTS = [
  { v:'0',   label:'None',        mid:0 },
  { v:'1-3', label:'1–3 hrs/wk',  mid:2 },
  { v:'4-7', label:'4–7 hrs/wk',  mid:5.5 },
  { v:'8+',  label:'8+ hrs/wk',   mid:9 },
];

const STORAGE_OPTS = [
  { v:'paper',   label:'Mostly paper, whiteboards, or memory', pts:4 },
  { v:'files',   label:'Files on one computer',                pts:12 },
  { v:'sheets',  label:'Spreadsheets (Excel / Google Sheets)', pts:20 },
  { v:'cloud',   label:'Cloud tools / a CRM',                  pts:25 },
];
const PLATFORM_OPTS = [
  { v:'google',    label:'Google (Gmail / Google Calendar)',   pts:10 },
  { v:'microsoft', label:'Microsoft 365 (Outlook)',            pts:10 },
  { v:'mixed',     label:'A mix of both',                      pts:6 },
  { v:'other',     label:'Something else / not sure',          pts:2 },
];
// The five stages of the AI adoption path. The assessment's headline
// result is which stage they're at — concrete self-descriptions, not
// frequency ("daily chat" lands at stage 2 of 5, which is honest).
const STAGES = [
  { n: 1, label: 'Getting started',
    solo: "Haven't really used AI yet",
    team: "Nobody here really uses AI yet",
    desc: "You haven't started with AI — which means every early win is still on the table, and you skip everyone else's bad habits.",
    next: 'Start with plain AI chat: pick one real task this week — an email, a draft, a summary — and do it with Claude or ChatGPT.' },
  { n: 2, label: 'Chat user',
    solo: 'I use AI chat (ChatGPT, Claude) for questions and drafting',
    team: 'Some of us use AI chat (ChatGPT, Claude) for questions and drafting',
    desc: 'You use AI as a chat assistant — real value, and still the shallow end of what it can do.',
    next: 'Give AI standing context: custom instructions and a project or saved prompts, so every chat starts out already knowing your business.' },
  { n: 3, label: 'Working with context',
    solo: "I've set up custom instructions, projects, or saved prompts — AI knows my business",
    team: 'We have shared instructions, projects, or prompt templates — AI knows our business',
    desc: 'AI knows your business — drafts start from your reality instead of a blank slate.',
    next: 'Connect AI to the real work: your files, email, and calendar, so it works with your actual information instead of what you paste in.' },
  { n: 4, label: 'Connected',
    solo: 'AI is connected to my files, email, or business tools',
    team: 'AI is connected to our files, email, or business tools',
    desc: 'AI works with your actual files, email, and tools — the copy-paste era is over.',
    next: 'Let AI carry recurring work: scheduled tasks and simple automations for the jobs that repeat every week.' },
  { n: 5, label: 'Automated',
    solo: 'AI agents or automations run some of my work on their own',
    team: 'AI agents or automations run some of our work on their own',
    desc: 'Agents and automations run parts of the work without you — the front edge of what small businesses are doing.',
    next: "You're past adoption — the work now is coverage and reliability: more workflows, better checks, and making sure the whole team benefits." },
];
const APPETITE_OPTS = [
  { v:'<1',  label:'Less than an hour a week',                 pts:5 },
  { v:'1-2', label:'1–2 hours a week',                         pts:10 },
  { v:'3-5', label:'3–5 hours a week',                         pts:18 },
  { v:'5+',  label:'5+ hours a week',                          pts:25 },
];
const WORRY_OPTS = ['Privacy / my data','Getting it wrong in front of customers','Cost','Time to learn it','Not sure where to start','No big worries'];

const MOVES = {
  quoting: {
    title: 'Cut quoting from hours to minutes',
    why: h => `You reported ${h} on quotes and proposals — usually the single fastest AI win for a service business.`,
    diy: 'Save your three best past quotes as examples, then have Claude draft each new one from a two-line brief in your voice and format. You review, adjust the numbers, send.',
    call: "On the call we'll map your quoting flow end to end and pick the tool that fits it.",
  },
  scheduling: {
    title: 'Stop juggling the calendar by hand',
    why: h => `${h} on scheduling is booking-link territory — this one is more setup than AI, and it sticks.`,
    diy: 'Set up a booking page (you can start free), link it from your site, email signature, and Google Business Profile, and let clients pick their own slots.',
    call: "On the call we'll untangle what should be self-serve booking vs. what genuinely needs a human.",
  },
  followup: {
    title: 'Close the follow-up gap',
    why: h => `${h} on follow-up usually means leads are also slipping through untouched — the most expensive kind of admin.`,
    diy: 'Have Claude draft a simple 3-touch follow-up sequence in your voice (day 1, day 3, day 10), then work it from a basic spreadsheet until it earns automation.',
    call: "On the call we'll find where leads actually stall and what to automate first.",
  },
  questions: {
    title: 'Answer the repeated questions once',
    why: h => `${h} answering the same questions means the answers belong on your website and in an assistant, not in your head.`,
    diy: 'List the 10 questions you answer most, have Claude polish your answers, and publish them as a real FAQ page. That also feeds AI search.',
    call: "On the call we'll decide which answers belong on the site, in email templates, or in an AI assistant.",
  },
  dataentry: {
    title: 'Connect the systems you re-type between',
    why: h => `${h} moving data between systems is pure leak — nobody should be the glue between two pieces of software.`,
    diy: 'Write down each hop (where the data starts, where you re-type it). Even one automated hop — receipts to spreadsheet, form to CRM — pays back weekly.',
    call: "On the call we'll pick the one connection with the best payback and how to build it.",
  },
  intake: {

const state = {
  step: 1,
  name:'', description:'', teamSize:'',
  businessType:'', bucket:'', classifiedFor:'', classifierModel:'', recsModel:'',
  hours: {},            // catId -> option value
  storage:'', platform:'', otherTools:'',
  stage:0, teamShare:'', appetite:'', worry:'',
  contactName:'', email:'',
  recs: null,          // null = not requested; {pending:true}; {moves, source}
  sendStatus: 'idle',
};
const TOTAL_STEPS = 5;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');
const shell = document.getElementById('shell');

function midFor(catId) {
  const opt = HOUR_OPTS.find(o => o.v === (state.hours[catId] || '0'));
  return opt ? opt.mid : 0;
}
function labelFor(catId) {
  const opt = HOUR_OPTS.find(o => o.v === (state.hours[catId] || '0'));
  return opt && opt.mid > 0 ? opt.label.replace('/wk', ' a week') : 'no time';
}

function stageInfo() {
  return STAGES.find(st => st.n === state.stage) || STAGES[0];
}
function nextStageInfo() {
  return STAGES.find(st => st.n === state.stage + 1) || null;
}

// Supporting context — notes, not scores. The stage is the headline; these
// say what helps or hinders the climb to the next one.
function contextNotes() {
  const notes = [];
  notes.push({
    name: 'Digital systems',
    note: state.storage === 'paper'
      ? 'Your business information lives on paper and memory — giving it a digital home is part of any next step.'
      : state.storage === 'cloud'
        ? 'Your information already lives where AI can reach it — nothing blocks the next step.'
        : 'Spreadsheets and files are workable — cloud tools make the later stages easier, but nothing here blocks you.',
  });
  notes.push({
    name: 'Time for the next step',
    note: state.appetite === '<1'
      ? 'Under an hour a week is tight but workable — the first moves below are sized to fit it.'
      : 'The setup phase needs a few hours a week. After that it pays you back.',
  });
  if (co() && state.teamShare) {
    notes.push({
      name: 'Team adoption',
      note: state.teamShare === 'most'
        ? 'Most of the team already uses AI — next steps can be team-wide from day one.'
        : state.teamShare === 'none'
          ? "Nobody on the team uses AI regularly yet — part of the next step is getting one person genuinely productive with it."
          : 'A few people use AI — spreading what works to one more person multiplies every move below.',
    });
  }
  return notes;
}
function opportunityMid() {
  return HOURS_TOTAL();
}
function HOURS_TOTAL() {
  return cats().reduce((n, c) => n + midFor(c.id), 0);
}
function hoursBack() {
  return Math.round(cats().reduce((n, c) => n + midFor(c.id) * c.frac, 0));
}
function grade(score) {
  return score >= 85 ? 'A' : score >= 70 ? 'B' : score >= 55 ? 'C' : score >= 40 ? 'D' : 'F';
}
function gradeColor(g) { return { A:'#3a6f4d', B:'#5b7a5e', C:'#9C6A33', D:'#A86237', F:'#A04324' }[g] || '#9C6A33'; }
function interpret(score) {
  if (score >= 85) return 'You are unusually well set up. The work now is picking the highest-payback moves, not getting ready.';
  if (score >= 70) return 'Solid foundation — a couple of gaps to close, then AI can start returning hours quickly.';
  if (score >= 55) return 'Partway there. The gaps below are specific, and none of them takes months.';
  if (score >= 40) return 'Real opportunity, real gaps. The good news: the first fixes are the cheap ones.';
  return 'Starting from scratch — which means the early wins are big and nothing has to be undone.';
}
function topMoves() {
  return cats()
    .map(c => ({ ...c, mid: midFor(c.id) }))
    .sort((a, b) => b.mid - a.mid)
    .slice(0, 3)
    .filter(c => c.mid > 0)
    .map(c => ({ id: c.id, hoursLabel: labelFor(c.id), ...MOVES[c.id] }));
}

// ---------------- shared UI ----------------
function progressBar(step) {
  const pct = Math.round((step / TOTAL_STEPS) * 100);
  return `<div class="progress-wrap">
    <div class="progress-labels"><span>Step ${step} of ${TOTAL_STEPS}</span><span>${pct}%</span></div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
  </div>`;
}
function stepWrap(o) {
  return `<div class="fade-in card">
    ${o.progress || ''}
    <p class="eyebrow">${o.eyebrow}</p>
    <h2 style="font-size:clamp(1.6rem,4vw,2.2rem)">${o.title}</h2>
    <p class="dek">${o.dek}</p>
    ${o.body}
    <p class="step-err" id="step-err" hidden></p>
    <div class="step-footer">
      ${o.back ? '<button class="ghost-btn" data-act="back">← Back</button>' : '<span></span>'}
      <button class="brand-btn" data-act="next">${o.nextLabel || 'Continue →'}</button>
    </div>
  </div>`;
}

// Each step sets stepMissing; clicking Continue shows what's incomplete instead
// of silently doing nothing. `live` re-checks as the user types, but only once
// errors are already visible.
let stepMissing = () => [];
function showStepErrors(live) {
  const err = document.getElementById('step-err');
  if (!err) return true;
  const missing = stepMissing();
  if (live && err.hidden) return !missing.length;
  root.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
  missing.forEach(m => { const el = m.id && document.getElementById(m.id); if (el) el.classList.add('input-error'); });
  err.textContent = (missing.length === 1 && missing[0].msg) || 'Please fill in the highlighted fields to continue.';
  err.hidden = !missing.length;
  return !missing.length;
}
function selectField(id, label, opts, value, placeholder) {
  return `<div><label class="label" for="${id}">${label}</label>
    <select class="input" id="${id}">
      <option value="">${placeholder || 'Choose one…'}</option>
      ${opts.map(o => `<option value="${esc(o.v ?? o)}" ${(o.v ?? o) === value ? 'selected' : ''}>${esc(o.label ?? o)}</option>`).join('')}
    </select></div>`;
}

// ---------------- report ----------------
function cannedMoves() {
  return topMoves().map(m => ({ title: m.title, why: m.why(m.hoursLabel), firstStep: m.diy, callNote: m.call }));
}

function fireRecommend() {
  if (state.recs) return;
  state.recs = { pending: true };
  const done = (moves, source) => { state.recs = { moves, source }; if (state.step === TOTAL_STEPS + 1) render(); };
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), 100000);
  fetch('/api/recommend', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      businessName: state.name, businessDescription: state.description.trim(),
      businessType: state.businessType, bucket: state.bucket, teamSize: state.teamSize,
      hours: state.hours, hourLabels: Object.fromEntries(cats().map(c => [c.id, c.label])),
      storage: state.storage, platform: state.platform, otherTools: state.otherTools,
      stage: state.stage, stageLabel: stageInfo().label, nextStage: nextStageInfo() ? { n: nextStageInfo().n, label: nextStageInfo().label, what: stageInfo().next } : null,
      teamShare: state.teamShare, appetite: state.appetite, worry: state.worry,
    }),
    signal: controller.signal,
  })
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      if (d && d.moves && d.moves.length >= 2) { state.recsModel = d.model || ''; done(d.moves, 'llm'); }
      else done(cannedMoves(), 'canned');
    })
    .catch(() => done(cannedMoves(), 'canned'))
    .finally(() => clearTimeout(t));
}

function submitLead(notes, st, moves, recsSource) {
  if (state.sendStatus !== 'idle') return;
  state.sendStatus = 'sending';
  const nx = nextStageInfo();
  fetch('/api/readiness-lead', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      businessName: state.name, teamSize: state.teamSize,
      businessDescription: state.description.trim(), businessType: state.businessType, bucket: state.bucket,
      industry: state.businessType,
      hours: state.hours, storage: state.storage, platform: state.platform, otherTools: state.otherTools,
      stage: st.n, stageLabel: st.label, nextStage: nx ? { n: nx.n, label: nx.label, what: st.next } : null,
      teamShare: state.teamShare, appetite: state.appetite, worry: state.worry,
      contactName: state.contactName, email: state.email,
      dims: notes, hoursBack: hoursBack(), moves, recsSource,
      classifierModel: state.classifierModel, recsModel: state.recsModel,
    }),
  }).then(r => { state.sendStatus = r.ok ? 'sent' : 'failed'; })
    .catch(() => { state.sendStatus = 'failed'; });
}

    : moves.length ? `<div class="section-block">

      <p class="section-dek">Written for ${esc(state.businessType || 'your business')}, from your answers — starting with the step to Stage ${nx ? nx.n : st.n}.</p>
      ${moves.map((m, i) => `
        <div style="padding:16px 0;border-top:1px solid var(--bone)">
          <p class="eyebrow" style="margin-bottom:4px">Priority ${i + 1}</p>
          <h4 style="font-size:18px;margin-bottom:6px">${esc(m.title)}</h4>
          <p style="font-size:14px;color:var(--muted);margin-bottom:8px">${esc(m.why)}</p>
          <p style="font-size:14px;margin-bottom:6px"><strong>First step:</strong> ${esc(m.firstStep)}</p>
          ${m.callNote ? `<p style="font-size:14px;color:var(--ink-700)">${esc(m.callNote)}</p>` : ''}
        </div>`).join('')}
    </div>` : ''}

    <div class="section-block" style="text-align:center;background:var(--walnut-700);border:0">
      <h3 style="color:var(--paper)">This report is the prep for your free call.</h3>
      <p class="section-dek" style="color:rgba(244,236,219,.7)">30 minutes, no charge, no pressure — we walk through where you are and plan the next step together, whether or not you hire me for any of it.</p>
      <a class="brand-btn" style="background:var(--honey-300);color:var(--walnut-700);text-decoration:none;display:inline-block" href="/ai-consulting#book" target="_top">Book the free 30-minute call →</a>
      <p class="hint" style="color:rgba(244,236,219,.5);margin-top:14px">✓ Report sent to ${esc(state.email)}</p>
    </div>

    <p style="text-align:center;font-size:14px;color:var(--muted);margin-top:8px">
      Want Claude set up in your voice this week? The <a href="/claude-instructions" target="_top" style="color:var(--honey-500)">$27 Custom Instructions file</a> is written from a 10-minute survey — by me, not a bot.
    </p>

    <div class="restart"><button class="ghost-btn" data-act="restart">← Start over</button></div>
  </div>`;

  if (recsReady && state.sendStatus === 'idle') submitLead(notes, st, moves, state.recs.source);
}

// ---------------- router ----------------
function render() {
  shell.classList.toggle('wide', state.step === TOTAL_STEPS + 1);
  if (state.step === 1) renderBasics();
  else if (state.step === 2) renderHours();
  else if (state.step === 3) renderSystems();
  else if (state.step === 4) renderAiToday();
  else if (state.step === 5) renderContact();
  else renderReport();
  try { parent.postMessage({ readinessHeight: document.body.scrollHeight }, '*'); } catch (e) {}
}

function keywordBucket(d) {
  d = d.toLowerCase();
  if (/massage|bodywork|therap|counsel|chiro|acupunct|dental|dentist|clinic|salon|barber|spa|aesthet|vet|groom|gym|fitness|yoga|pilates|train(er|ing)|coach|tutor|photograph|childcare|daycare/.test(d)) return 'appointment';
  if (/law|attorney|legal|account|bookkeep|tax|cpa|financ|advisor|insur|real estate|realtor|broker|property manage|mortgage|title|architect|engineer|consult|recruit|staffing|nonprofit/.test(d)) return 'professional';
  if (/shop|store|retail|boutique|e-?commerce|online store|florist|restaurant|cafe|coffee|bakery|brewery|bar\b|taproom|food truck|deli/.test(d)) return 'retail';
  return 'project';
}

async function classifyThenAdvance(btn) {
  const desc = state.description.trim();
  if (state.bucket && state.classifiedFor === desc) { state.step += 1; render(); window.scrollTo({ top: 0 }); return; }
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'Reading your business…';
  let result = null;
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 7000);
    const r = await fetch('/api/classify-business', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, name: state.name }),
      signal: controller.signal,
    });
    clearTimeout(t);
    if (r.ok) result = await r.json();
  } catch (e) { /* fall through to keyword bucket */ }
  state.bucket = (result && result.bucket) || keywordBucket(desc);
  state.businessType = (result && result.type) || 'Small business';
  state.classifierModel = (result && result.model) || 'keyword-fallback';
  state.classifiedFor = desc;
  state.hours = {}; // categories may have changed with the bucket
  btn.textContent = prev;
  btn.disabled = false;
  state.step += 1; render(); window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.getAttribute('data-act');
  if (act === 'next' && !showStepErrors()) { return; }
  if (act === 'next' && state.step === 1) { classifyThenAdvance(btn); }
  else if (act === 'next') { state.step += 1; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'back') { state.step = Math.max(1, state.step - 1); render(); }
  else if (act === 'restart') {
    Object.assign(state, { step:1, name:'', description:'', teamSize:'', businessType:'', bucket:'', classifiedFor:'', classifierModel:'', recsModel:'', hours:{}, storage:'', platform:'', otherTools:'', stage:0, teamShare:'', appetite:'', worry:'', contactName:'', email:'', recs:null, sendStatus:'idle' });
    render(); window.scrollTo({ top: 0 });
  }
});

/* ================================================================
   Reference view — /ai-business-assessment-mark loads this page with
   ?view=all. Every step (in all four question buckets, solo and team),
   the five stages, and the whole move catalog on one scrolling page.
   It drives the real step renderers, so it can't drift from the
   assessment a visitor actually takes.
================================================================ */
const REF_BUCKETS = ['appointment', 'project', 'retail', 'professional'];

function refHead(label, note) {
  return `<div class="ref-head"><h2>${esc(label)}</h2>${note ? `<p>${esc(note)}</p>` : ''}</div>`;
}

function refTable(head, rows) {
  return `<table class="ref-table"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAll() {
  shell.classList.add('wide');
  const out = [];
  const grab = (label, note, fn) => { fn(); out.push(refHead(label, note) + root.innerHTML); };

  // Sample answers, so every conditional field renders.
  Object.assign(state, {
    name: 'Harbor Dental', description: 'family dental practice', teamSize: 'Just me',
    businessType: 'Dental practice', bucket: 'appointment',
    hours: {}, storage: 'sheets', platform: 'google', otherTools: 'QuickBooks',
    stage: 2, teamShare: 'few', appetite: '1-2', worry: WORRY_OPTS[0],
    contactName: 'Sam', email: 'sam@harbordental.com',
    sendStatus: 'sent', // never submits a lead from the reference view
  });

  out.push('<p class="ref-label">AI Business Assessment — full question reference</p>');
  grab('Step 1 · The basics', 'The "what does your business do" answer is classified by /api/classify-business into one of four buckets, which decides every question after this.', renderBasics);

  REF_BUCKETS.forEach(b => {
    state.bucket = b;
    state.teamSize = 'Just me';
    grab('Step 2 · Where the hours go — ' + b + ' bucket',
      'Six categories, each with the share of the work AI can realistically absorb: ' +
        BUCKET_CATS[b].map(c => c.label + ' ' + Math.round(c.frac * 100) + '%').join(' · '),
      renderHours);
  });
  state.bucket = 'appointment';
  state.teamSize = '2–5 people';
  grab('Step 2 · with a team', 'Any team size other than "Just me" switches the wording from you to the company.', renderHours);
  state.teamSize = 'Just me';

  grab('Step 3 · Your systems', '', renderSystems);
  grab('Step 4 · Where you are with AI', 'Solo wording.', renderAiToday);
  state.teamSize = '2–5 people';
  grab('Step 4 · Where you are with AI, with a team', 'Team wording, plus the extra "how much of the team uses AI" question.', renderAiToday);
  state.teamSize = 'Just me';
  grab('Step 5 · One last thing', '', renderContact);

  out.push(refHead('The five stages', 'The headline result. Solo and team wording, plus the next step each stage is told to take.') +
    refTable(['#', 'Label', 'Solo wording', 'Team wording', 'What the report says', 'Next step'],
      STAGES.map(st => `<tr>
        <td class="ref-id">${st.n}</td>
        <td><strong>${esc(st.label)}</strong></td>
        <td>${esc(st.solo)}</td>
        <td>${esc(st.team)}</td>
        <td>${esc(st.desc)}</td>
        <td>${esc(st.next)}</td>
      </tr>`).join('')));

  out.push(refHead('The move catalog', 'The fallback "top 3 moves" when /api/recommend is unavailable. The three categories with the most reported hours win.') +
    refTable(['id', 'Move', 'Why it matters', 'First step on your own', 'What we do on the call'],
      Object.keys(MOVES).map(id => {
        const m = MOVES[id];
        return `<tr>
          <td class="ref-id">${esc(id)}</td>
          <td><strong>${esc(m.title)}</strong></td>
          <td>${esc(m.why('4–7 hrs a week'))}</td>
          <td>${esc(m.diy)}</td>
          <td>${esc(m.call)}</td>
        </tr>`;
      }).join('')));

  // The client-facing report, on the sample answers.
  state.hours = { intake: '4-7', questions: '8+', notes: '1-3' };
  state.recs = { moves: cannedMoves(), source: 'canned' }; // suppresses the live /api/recommend call
  grab('The report', 'What the visitor sees on the last screen, and what the emailed copy is built from. Shown with the canned moves; live reports use /api/recommend.', renderReport);

  root.innerHTML = out.map((h, i) => i ? '<hr class="ref-rule" />' + h : h).join('');
  try { parent.postMessage({ readinessHeight: document.body.scrollHeight }, '*'); } catch (e) {}
}

if (new URLSearchParams(location.search).get('view') === 'all') renderAll();
else render();
})();
</script>
