seoTitle: Free AI Business Assessment | Your Stage and Your Next Moves | Averde AI
seoDescription: >-
  A free three-minute assessment for small businesses. Answer where your hours go and how you use AI
  today, and get your stage on the five-stage AI path, the rough math on hours AI could hand back,
  and the next three moves worth making.
heroBadge: Free · 3 minutes · No credit card
heroHeadline: The AI Business Assessment
heroDek: >-
  Three minutes of questions about how you run the business — where the hours go, what systems you
  keep things in, how you use AI today. You get back your stage on a five-stage path, the rough math
  on hours AI could hand back, and the next three moves worth making. No pass, no fail.
useEyebrow: How to use it
useHeadline: What the assessment gives you to work with
useIntro: >-
  This is not a quiz that tells you whether you're allowed to start. Everyone is somewhere on the
  path, and the report is about the step in front of you.
useItems:
  - title: Find out where you actually are
    body: >-
      Five stages, from "haven't really started" to "automations run part of the work." Most owners
      guess wrong in both directions — using AI chat every day sounds advanced and lands at stage 2
      of 5. Knowing the real answer stops you buying tools built for a stage you're not at.
  - title: See what the admin is costing you
    body: >-
      You estimate the hours going into six kinds of work — the six change depending on what your
      business does, so a bodyworker gets asked about intake and session notes, and a contractor gets
      asked about quoting and crews. The report adds up a conservative estimate of what AI could
      realistically take off that number.
  - title: Get three moves, in order
    body: >-
      Written for the work you said takes the most time, with a first step you can do yourself this
      week and a note on what we'd cover together if you'd rather not. If the answer is all DIY,
      that's a fine outcome.
  - title: Bring it to the free call
    body: >-
      Your report is emailed to you and becomes the agenda for a free 30-minute call. You bring the
      report, I bring a copy, and we pressure-test the hours math and pick the first thing to build.
widgetEyebrow: Start here
widgetHeadline: Take the assessment
widgetDek: >-
  Three minutes. Your report appears on the last screen, and a copy goes to your inbox.
bookEyebrow: The free 30-minute call
bookHeadline: Want to walk through your report together?
bookDek: >-
  Book a time and we'll go through your stage, check the hours math against your real week, and plan
  the next step. You leave with a plan whether or not you hire me for any of it.
bookCta: Book your free 30-minute call →
